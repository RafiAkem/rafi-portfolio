name: Deploy ke VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Tidak perlu checkout: VPS menarik repo dari GitHub sendiri.
      # Deploy key di VPS di-restrict (command=) jadi HANYA bisa menjalankan
      # /home/ubuntu/deploy-rafi-portfolio.sh — bukan shell interaktif.
      - name: Jalankan deploy di VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@43.134.40.53 \
            'echo "[ci] konek via deploy key; forced command di server yang deploy"'
